<head>

    <link rel="stylesheet" href="contact.css">

<body>

    <div id="contact-page">

            </p>

                    </div>
                </div>


                <div class="contact-detail">

                        <i class="fa-solid fa-envelope"></i>
                    </div>

                    <div>

                        <p>hello@jackwelllogistics.com</p>
                    </div>
                </div>


                <div class="contact-detail">
                    <div class="contact-icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>

                    <div>
